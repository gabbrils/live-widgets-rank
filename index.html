<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body, html {
            background: transparent;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Configuração do Banner do Livepix */
        .livepix-banner {
            position: absolute;
            top: 0; /* Se quiser descer o banner um pouquinho para alinhar com o primeiro item, mude para algo como top: 20px; */
            left: 10%; /* 10% é o valor exato onde o ranking de scale(0.8) começa */
            width: 250px; /* Largura ajustada para o formato do QR Code da imagem */
            height: 400px; /* Altura ajustada para o formato do QR Code da imagem */
            border: none;
            z-index: 9999; /* Garante que ficará sempre por cima das outras janelas */
        }

        /* Contêiner dos rankings rotativos */
        .cycle-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Configuração das janelas de Ranking */
        .rank-item {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0; /* Começam invisíveis */
            transition: opacity 1.5s ease-in-out; /* Transição suave de 1.5s */
            pointer-events: none;
            transform: scale(0.8); /* O ranking fica com 80% do tamanho */
            transform-origin: top center; /* Centralizado no topo */
        }

        /* Classe que o JavaScript vai alternar */
        .active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Link 1: BANNER DO LIVEPIX (Fixo e alinhado ao ranking) -->
    <iframe class="livepix-banner" src="https://widget.livepix.gg/embed/c80de831-d76e-4340-a5f0-7ef88294b32f"></iframe>

    <!-- Links 2 a 5: RANKINGS ROTATIVOS -->
    <div class="cycle-container">
        <!-- Link 2 -->
        <iframe id="rank1" class="rank-item active" src="https://tikfinity.zerody.one/widget/topliker?cid=3608952"></iframe>

        <!-- Link 3 -->
        <iframe id="rank2" class="rank-item" src="https://tikfinity.zerody.one/widget/ranking?cid=3608952"></iframe>

        <!-- Link 4 -->
        <iframe id="rank3" class="rank-item" src="COLOQUE_SEU_LINK_AQUI"></iframe>
        
        <!-- Link 5 -->
        <iframe id="rank4" class="rank-item" src="COLOQUE_SEU_LINK_AQUI"></iframe>
    </div>

    <script>
        // O JavaScript agora vai pegar apenas os 4 iframes de ranking para rotacionar
        const ranks = document.querySelectorAll('.rank-item');
        let currentIndex = 0;

        function rotateRanks() {
            // Remove a classe 'active' do item atual
            ranks[currentIndex].classList.remove('active');

            // Calcula o próximo índice (volta ao zero após o último)
            currentIndex = (currentIndex + 1) % ranks.length;

            // Adiciona a classe 'active' ao próximo item
            ranks[currentIndex].classList.add('active');
        }

        // Executa a troca a cada 30.000 milissegundos (30 segundos)
        setInterval(rotateRanks, 30000);
    </script>

</body>
</html>
